# Configuración de placa para el OCR colombiano (fast-plate-ocr).
# Igual a la del modelo global cct-v2 (para reutilizar todos sus pesos al afinar),
# pero sin cabeza de región/país: solo se leen placas colombianas.
max_plate_slots: 10
alphabet: '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ_'
pad_char: '_'
img_height: 64
img_width: 128
keep_aspect_ratio: false
interpolation: linear
image_color_mode: rgb
